services:
  - type: web
    name: art-portifolio-backend
    env: node
    buildCommand: npm install --production
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 3000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_TTL_HOURS
        value: 8
      - key: IMAGE_SERVICE_URL
        sync: false
